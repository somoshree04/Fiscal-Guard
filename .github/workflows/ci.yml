
name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: pytest -v
        working-directory: backend
      
      - name: Run Linter
        run: ruff check .
        working-directory: backend

      - name: Run Tests
        run: pytest -v
        working-directory: backend

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fiscal
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: fiscalguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fiscal"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fiscal:ci-password@localhost:5432/fiscalguard
      SECRET_KEY: ci-secret-key-for-testing-purposes-only
      POSTGRES_PASSWORD: ci-password
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # 2. CREATE A DUMMY .ENV FILE SO DOCKER / DOTENV DOES NOT CRASH
      - name: Create .env file from example
        run: cp .env.example .env
        working-directory: backend

      - run: |
          python -m pip install --upgrade pip 
          pip install -r backend/requirements.txt

      - run: alembic upgrade head
        working-directory: backend
      - run: alembic check
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend